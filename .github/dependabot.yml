version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /tools/template
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directory: /fixtures/nuget
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directories: ["/", "/templates/release", "/.github/actions/e08-checkout"]
    exclude-paths: [".github/workflows/pr-title.yml", ".github/workflows/pr-labeler.yml"]
    ignore:
      - dependency-name: splrad/steward
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
