name: E08 / release.yml health acceptance
on:
  workflow_dispatch:
permissions: {}
jobs:
  business-fixture:
    if: github.repository == 'splrad/steward-e08-bootstrap' && github.repository_id == '1440689606' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record isolated business attempt
        shell: bash
        env:
          FAIL_BUSINESS: ${{ vars.E08_HEALTH_FAIL_BUSINESS }}
        run: |
          printf 'Isolated business fixture: run=%s attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          [[ "$FAIL_BUSINESS" != true ]]
  automation-health:
    if: github.repository == 'splrad/steward-e08-bootstrap' && github.repository_id == '1440689606' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    concurrency:
      group: steward-automation-health
      cancel-in-progress: false
    steps:
      - name: automation-health-native
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          HEALTH_ISSUE: ${{ vars.STEWARD_HEALTH_ISSUE }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          api() { gh api --method GET -H 'X-GitHub-Api-Version: 2026-03-10' "$1" 2>/dev/null; }
          [[ "$HEALTH_ISSUE" =~ ^[1-9][0-9]*$ ]]
          repo=$(api repos/splrad/steward-e08-bootstrap)
          jq -e --arg branch "$DEFAULT_BRANCH" '.id==1440689606 and .full_name=="splrad/steward-e08-bootstrap" and .default_branch==$branch and .archived==false and .disabled==false' <<<"$repo" >/dev/null
          current=$(api "repos/splrad/steward-e08-bootstrap/actions/runs/$CURRENT_RUN_ID")
          jq -e --argjson id "$CURRENT_RUN_ID" --argjson attempt "$CURRENT_ATTEMPT" --arg branch "$DEFAULT_BRANCH" '.id==$id and .run_attempt==$attempt and .repository.id==1440689606 and .head_repository.id==1440689606 and .head_branch==$branch and (.path==".github/workflows/release.yml" or .path==".github/workflows/sync-managed.yml") and (.event=="schedule" or .event=="workflow_dispatch" or .event=="push")' <<<"$current" >/dev/null
          issue=$(api "repos/splrad/steward-e08-bootstrap/issues/$HEALTH_ISSUE")
          jq -e --argjson number "$HEALTH_ISSUE" '.number==$number and .pull_request==null' <<<"$issue" >/dev/null
          bot=$(api 'users/github-actions%5Bbot%5D' | jq -er 'select(.type=="Bot")|.id')
          marker='<!-- splrad-automation-health:v2 -->'
          read_codes() {
            gh api --method GET --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward-e08-bootstrap/issues/$HEALTH_ISSUE/comments?per_page=100" 2>/dev/null |
              jq -ce --arg marker "$marker" --argjson bot "$bot" 'if all(.[];type=="array") then add else error("comments unavailable") end | [.[]|select(.user.id==$bot and (.body//""|startswith($marker+"\n")))] | sort_by(.id)|last | if .==null then [] else .body|split("\n")[1]|fromjson end | if type=="array" and all(.[];type=="string" and test("^(release\\.yml|sync-managed\\.yml):(WORKFLOW_UNAVAILABLE|WORKFLOW_DISABLED|ENABLE_UNCONFIRMED|RUN_UNAVAILABLE|WAKE_UNKNOWN|ENTRY_OVERDUE)$")) then sort|unique else error("health state unavailable") end'
          }
          previous=$(read_codes)
          codes='[]'
          record() { codes=$(jq -cn --argjson codes "$codes" --arg code "$file:$1" '$codes+[$code]'); }
          latest_run() {
            gh run list --repo splrad/steward-e08-bootstrap --workflow "$file" --branch "$DEFAULT_BRANCH" --limit 1 --json databaseId,createdAt,status,conclusion 2>/dev/null |
              jq -ce 'if type=="array" and length<=1 and all(.[]; (.databaseId|type)=="number" and .databaseId>0 and (.databaseId|floor)==.databaseId and (.createdAt|type)=="string" and (.status=="completed" or .status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")) then . else error("recent Run unavailable") end'
          }
          workflow_matches() {
            jq -e --arg path ".github/workflows/$file" --argjson id "$workflow_id" '.id==$id and .path==$path' <<<"$1" >/dev/null
          }
          for file in release.yml sync-managed.yml; do
            if ! workflow=$(api "repos/splrad/steward-e08-bootstrap/actions/workflows/$file") ||
               ! workflow_id=$(jq -er --arg path ".github/workflows/$file" 'select(.path==$path and (.id|type)=="number" and .id>0 and (.id|floor)==.id)|.id' <<<"$workflow"); then
              record WORKFLOW_UNAVAILABLE; continue
            fi
            state=$(jq -r '.state' <<<"$workflow")
            if [[ "$state" == disabled_inactivity ]]; then
              # Recheck the current state immediately before the only enable request.
              if ! workflow=$(api "repos/splrad/steward-e08-bootstrap/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record WORKFLOW_UNAVAILABLE; continue; fi
              state=$(jq -r '.state' <<<"$workflow")
              if [[ "$state" == disabled_inactivity ]]; then
                gh api --method PUT -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward-e08-bootstrap/actions/workflows/$workflow_id/enable" >/dev/null 2>&1 || true
                if ! workflow=$(api "repos/splrad/steward-e08-bootstrap/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record ENABLE_UNCONFIRMED; continue; fi
                state=$(jq -r '.state' <<<"$workflow")
                if [[ "$state" == disabled_inactivity ]]; then record ENABLE_UNCONFIRMED; continue; fi
              fi
            fi
            if [[ "$state" != active ]]; then record WORKFLOW_DISABLED; continue; fi
            if ! runs=$(latest_run); then record RUN_UNAVAILABLE; continue; fi
            created=$(jq -r '.[0].createdAt//"1970-01-01T00:00:00Z"' <<<"$runs")
            if ! created_epoch=$(date -u -d "$created" +%s); then record RUN_UNAVAILABLE; continue; fi
            now=$(date -u +%s)
            if ((created_epoch>now)); then record RUN_UNAVAILABLE; continue; fi
            if ((now-created_epoch<=2*3600)); then continue; fi
            # A recent Run does not prove that older Runs have finished. Native concurrency
            # serializes this observation wake; business records retain their own budgets.
            if ! workflow=$(api "repos/splrad/steward-e08-bootstrap/actions/workflows/$workflow_id") || ! workflow_matches "$workflow"; then record WORKFLOW_UNAVAILABLE; continue; fi
            if [[ "$(jq -r '.state' <<<"$workflow")" != active ]]; then record WORKFLOW_DISABLED; continue; fi
            response_known=true
            gh workflow run "$file" --repo splrad/steward-e08-bootstrap --ref "$DEFAULT_BRANCH" >/dev/null 2>&1 || response_known=false
            # Read once after the write, including a lost response. Retry only on a later
            # fixed wake after it has read native state again.
            if ! observed=$(latest_run); then record WAKE_UNKNOWN; continue; fi
            observed_created=$(jq -r '.[0].createdAt//"1970-01-01T00:00:00Z"' <<<"$observed")
            if ! observed_epoch=$(date -u -d "$observed_created" +%s); then record WAKE_UNKNOWN; continue; fi
            if ((observed_epoch>=now && observed_epoch<=$(date -u +%s))); then continue; fi
            if [[ "$response_known" == true ]]; then record ENTRY_OVERDUE; else record WAKE_UNKNOWN; fi
          done
          codes=$(jq -c 'sort|unique' <<<"$codes")
          if [[ "$codes" != "$previous" ]]; then
            body=$(printf '%s\n%s\n\n中央入口观察：%s\nhttps://github.com/splrad/steward-e08-bootstrap/actions/runs/%s\n' "$marker" "$codes" "$codes" "$CURRENT_RUN_ID")
            payload=$(jq -cn --arg body "$body" '{body:$body}')
            gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "repos/splrad/steward-e08-bootstrap/issues/$HEALTH_ISSUE/comments" --input - <<<"$payload" >/dev/null 2>&1 || true
            [[ "$(read_codes)" == "$codes" ]]
          fi
          [[ "$codes" == '[]' ]]
